services:
  - type: web
    name: dolapo-ogunyemi-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.21.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_SITE_URL
        value: https://dolapo-ogunyemi-portfolio.onrender.com
